services:
  backend:
    build:
      context: ./backend
    container_name: foodapp-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      MONGODB_URI: ${MONGODB_URI}
      CLIENT_URL: http://localhost:8080
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
    container_name: foodapp-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"